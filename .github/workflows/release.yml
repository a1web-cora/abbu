# .github/workflows/release.yml
name: Release gem

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: rubygems-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify authorized source and reproducible build timestamp
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]]
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify tag matches gem version
        shell: bash
        run: |
          version="$(ruby -Ilib -rabbu/version -e 'print Abbu::VERSION')"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match gem version ${expected}" >&2
            exit 1
          fi

      - name: Verify release package
        run: |
          bin/spec
          bin/lint
          bin/package

      - uses: rubygems/release-gem@v1
