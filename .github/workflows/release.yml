# .github/workflows/release.yml
name: Release gem

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify release package
        run: |
          bin/spec
          bin/lint
          bin/package

      - name: Verify tag matches gem version
        shell: bash
        run: |
          version="$(ruby -Ilib -rabbu/version -e 'print Abbu::VERSION')"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match gem version ${expected}" >&2
            exit 1
          fi

      - uses: rubygems/release-gem@v1
