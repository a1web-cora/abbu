# .github/workflows/ci.yml
name: CI

# Pull requests validate proposed commits. Pushes validate only the canonical
# branch after integration, avoiding duplicate push + pull_request matrices for
# feature branches with an open PR.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Run RuboCop
        if: ${{ matrix.ruby-version == '3.3' }}
        run: bin/lint

      - name: Run RSpec
        run: bin/spec
